plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.example.posecapture'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.posecapture'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
def poseModel = file('src/main/assets/pose_landmarker_lite.task')
tasks.register('downloadPoseModel') {
    outputs.file(poseModel)
    doLast {
        if (!poseModel.exists()) {
            poseModel.parentFile.mkdirs()
            new URL('https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task').withInputStream { input ->
                poseModel.withOutputStream { output -> output << input }
            }
        }
    }
}
preBuild.dependsOn downloadPoseModel
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'
}
